spring.datasource.url=jdbc:h2:mem:hospedagem_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Sobrescreve o dialeto MySQL herdado de application.properties — sem isto o
# Hibernate gera DDL MySQL contra o H2 e as tabelas não são criadas.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

